name: 🐛 Bug Report
description: Report a defect in dart_quill_delta
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "10.8.3"
    validations:
      required: true
  - type: input
    id: dart
    attributes:
      label: Dart SDK version
      placeholder: "3.x.x"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal reproducible code
      description: A self-contained snippet that reproduces the issue.
      render: dart
  - type: textarea
    id: logs
    attributes:
      label: Logs / stacktrace
      render: shell